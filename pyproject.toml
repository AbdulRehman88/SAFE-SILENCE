[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-silence"
version = "0.20.1"
description = "Failure-aware semantic in-network computing for underwater digital twins"
readme = "README.md"
license = "MIT"
authors = [{name = "Abdul Rehman"}]
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.9,<4",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
cpu = ["torch>=2.13,<3"]

[project.scripts]
safe-silence = "safe_silence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
